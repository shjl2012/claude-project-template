schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

operations:
  archive:
    guidance:
      - Before completing this archive, check whether the change being
        archived affects README.md's [Section A], [Section B], or
        [Section C] sections (replace with your project's actual section
        names), and update README.md accordingly if so.
      - Archive on the change's own branch (`<type>/<change-name>`), never
        on main/master. After the archive move, commit it on that branch.
      - Then merge into the protected branch with a merge commit
        (`git switch main && git merge --no-ff <type>/<change-name>`).
        Never squash or fast-forward. The git hooks reject merging a
        change that is still unarchived.
      - Finally delete the source branch with the safe delete
        (`git branch -d <type>/<change-name>`). Never use `git branch -D`.
